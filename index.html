
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrafficVoice - Blind Spot Safety</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 620px;
      margin: 35px auto;
      padding: 0 18px;
      line-height: 1.5;
      color: #222;
    }

    h2 {
      margin-bottom: 8px;
    }

    button {
      font-size: 16px;
      padding: 12px 16px;
      margin: 6px 4px 6px 0;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
    }

    button:active {
      opacity: 0.8;
    }

    #connect {
      background: #16803c;
    }

    #testBoth {
      background: #c62828;
    }

    #status {
      padding: 12px;
      background: #f1f1f1;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .note {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h2>TrafficVoice</h2>

  <p>
    Smart blind-spot and T-junction accident prevention
    using vehicle detection, traffic signals and voice alerts.
  </p>

  <p class="note">
    Keep this page open. Connect your boAt speaker to your phone
    and keep the ESP32 powered on.
  </p>

  <button id="connect">Connect to TrafficVoice</button>

  <hr>

  <h3>Test voice alerts</h3>

  <button id="testMain">Test main-road voice</button>

  <button id="testSide">Test converging-road voice</button>

  <button id="testBoth">Test both-road danger warning</button>

  <p id="status">Not connected. You can test voice alerts below.</p>

  <script>
    // Must match the ESP32 BLE firmware
    const SERVICE_UUID =
      "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

    const CHARACTERISTIC_UUID =
      "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    const statusEl = document.getElementById("status");

    let lastSpokenState = "";
    let lastSpokenAt = 0;
    let activeSpeechPriority = false;

    // Voice messages
    const MAIN_MESSAGE =
      "Slow down for main road.";

    const SIDE_MESSAGE =
      "Slow down for converging road.";

    const BOTH_MESSAGE =
      "Warning! Vehicles approaching from both roads. " +
      "Stop and wait until the intersection is clear.";

    // Speak a message through the phone's audio output.
    // If the phone is connected to a boAt speaker,
    // the voice should play through that speaker.
    function speak(message, state) {
      const now = Date.now();

      const isPriority =
        state === "BOTH" || state.startsWith("TEST_BOTH_");

      // Do not interrupt an ongoing both-road danger warning
      // with a less urgent warning.
      if (activeSpeechPriority && !isPriority) {
        return;
      }

      // Prevent duplicate alerts for the same state
      // within three seconds.
      if (
        state === lastSpokenState &&
        now - lastSpokenAt < 3000
      ) {
        return;
      }

      lastSpokenState = state;
      lastSpokenAt = now;

      // A BOTH warning takes priority over other speech.
      window.speechSynthesis.cancel();

      activeSpeechPriority = isPriority;

      const utterance = new SpeechSynthesisUtterance(message);

      utterance.lang = "en-IN";
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;

      utterance.onstart = () => {
        statusEl.textContent = "Speaking: " + message;
      };

      utterance.onend = () => {
        activeSpeechPriority = false;
        statusEl.textContent = "Voice alert completed: " + message;
      };

      utterance.onerror = (event) => {
        activeSpeechPriority = false;
        statusEl.textContent =
          "Speech error: " + event.error;
      };

      window.speechSynthesis.speak(utterance);
    }

    // Manual voice tests
    document.getElementById("testMain")
      .addEventListener("click", () => {
        speak(MAIN_MESSAGE, "TEST_MAIN_" + Date.now());
      });

    document.getElementById("testSide")
      .addEventListener("click", () => {
        speak(SIDE_MESSAGE, "TEST_SIDE_" + Date.now());
      });

    document.getElementById("testBoth")
      .addEventListener("click", () => {
        speak(BOTH_MESSAGE, "TEST_BOTH_" + Date.now());
      });

    // Connect the webpage to the ESP32 through BLE
    document.getElementById("connect")
      .addEventListener("click", async () => {

        if (!navigator.bluetooth) {
          statusEl.textContent =
            "Bluetooth is unavailable. Open this HTTPS page " +
            "in a supported browser, preferably Chrome on Android.";
          return;
        }

        try {
          statusEl.textContent =
            "Searching for TrafficVoice. Select it in the Bluetooth picker.";

          const device = await navigator.bluetooth.requestDevice({
            filters: [{ name: "TrafficVoice" }],
            optionalServices: [SERVICE_UUID]
          });

          device.addEventListener(
            "gattserverdisconnected",
            () => {
              statusEl.textContent =
                "ESP32 disconnected. Tap Connect to TrafficVoice to reconnect.";
            }
          );

          statusEl.textContent = "Connecting to ESP32...";

          const server = await device.gatt.connect();

          const service =
            await server.getPrimaryService(SERVICE_UUID);

          const characteristic =
            await service.getCharacteristic(CHARACTERISTIC_UUID);

          // Listen before enabling notifications
          characteristic.addEventListener(
            "characteristicvaluechanged",
            (event) => {
              const value = new TextDecoder()
                .decode(event.target.value)
                .trim()
                .toUpperCase();

              statusEl.textContent =
                "Received from ESP32: " + value;

              if (value === "MAIN") {
                speak(MAIN_MESSAGE, "MAIN");

              } else if (value === "CONVERGING") {
                speak(SIDE_MESSAGE, "CONVERGING");

              } else if (value === "BOTH") {
                speak(BOTH_MESSAGE, "BOTH");
              }
            }
          );

          await characteristic.startNotifications();

          statusEl.textContent =
            "Connected to TrafficVoice. Waiting for vehicle detection.";

          speak(
            "TrafficVoice connected. System ready.",
            "CONNECTED_" + Date.now()
          );

        } catch (error) {
          statusEl.textContent =
            "Connection error: " + error.message;
        }
      });
  </script>
</body>
</html>
